name: Create Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.22.0

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get commit history
        id: get_commits
        run: |
          # Get the previous tag to determine the range
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            # Get commits between previous tag and current tag
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD)
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_previous_tag=true" >> $GITHUB_OUTPUT
          else
            # If no previous tag, get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --oneline -20)
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_previous_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait for build workflows to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          COMMIT_SHA=$(git rev-parse HEAD)

          WORKFLOWS=(
            "windows_build.yml"
            "osx_build.yml"
            "ubuntu_build.yml"
          )

          MAX_ATTEMPTS=240
          SLEEP_SECONDS=60

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Checking build workflows (attempt $attempt/$MAX_ATTEMPTS)..."

            ALL_COMPLETE=true

            for workflow in "${WORKFLOWS[@]}"; do
              RUN=$(gh run list \
                --workflow="$workflow" \
                --commit="$COMMIT_SHA" \
                --limit=1 \
                --json databaseId,status,conclusion \
                --jq '.[0]')

              if [ -z "$RUN" ]; then
                echo "$workflow: not started"
                ALL_COMPLETE=false
                continue
              fi

              STATUS=$(echo "$RUN" | jq -r '.status')
              CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')

              echo "$workflow: status=$STATUS conclusion=$CONCLUSION"

              if [ "$STATUS" != "completed" ]; then
                ALL_COMPLETE=false
              fi
            done

            if [ "$ALL_COMPLETE" = true ]; then
              echo "All build workflows have completed."
              break
            fi

            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "Timeout reached. Proceeding with completed builds."
              break
            fi

            sleep "$SLEEP_SECONDS"
          done

      - name: Download artifacts from successful builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
      
          mkdir -p artifacts
      
          COMMIT_SHA=$(git rev-parse HEAD)
      
          WORKFLOWS=(
            "windows.yml"
            "macos.yml"
            "ubuntu.yml"
          )
      
          for workflow in "${WORKFLOWS[@]}"; do
            echo ""
            echo "========================================"
            echo "Checking $workflow"
            echo "========================================"
      
            RUN=$(gh run list \
              --workflow="$workflow" \
              --commit="$COMMIT_SHA" \
              --limit=1 \
              --json databaseId,status,conclusion \
              --jq '.[0]')
      
            if [ -z "$RUN" ]; then
              echo "No run found for $workflow. Skipping."
              continue
            fi
      
            RUN_ID=$(echo "$RUN" | jq -r '.databaseId')
            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
      
            echo "Run ID: $RUN_ID"
            echo "Status: $STATUS"
            echo "Conclusion: $CONCLUSION"
      
            if [ "$STATUS" != "completed" ]; then
              echo "$workflow has not completed. Skipping."
              continue
            fi
      
            if [ "$CONCLUSION" != "success" ]; then
              echo "$workflow failed. Skipping its artifacts."
              continue
            fi
      
            echo "Downloading artifacts from $workflow..."
      
            gh run download "$RUN_ID" \
              --dir "artifacts/$workflow" \
              --pattern "GeoDa-*"
      
            echo "Artifacts downloaded from $workflow."
          done
      
          echo ""
          echo "========================================"
          echo "Downloaded artifacts"
          echo "========================================"
      
          find artifacts -type f | sort || true

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f | sort

      - name: Create Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.get_version.outputs.tag }}" \
            --title "GeoDa ${{ steps.get_version.outputs.version }}" \
            --notes "$(cat <<'EOF'
          ## GeoDa ${{ steps.get_version.outputs.version }}

          ### What's Changed

          This release includes the following changes since the previous version:

          ${{ steps.get_commits.outputs.commits }}

          For detailed information about changes in this release, see the [changelog](https://github.com/GeoDaCenter/geoda/blob/master/CHANGELOG.md).
          EOF
          )"

      - name: Upload available release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          set -e
      
          VERSION="${{ steps.get_version.outputs.version }}"
      
          upload_if_exists() {
            local file="$1"
      
            if [ -f "$file" ]; then
              echo "Uploading: $file"
      
              gh release upload \
                "$TAG" \
                "$file"
      
            else
              echo "Not found, skipping: $file"
            fi
          }
      
          # Windows
          upload_if_exists \
            "./artifacts/windows.yml/GeoDa-Windows-x86-installer/GeoDa_${VERSION}_x86_Setup.exe"
      
          upload_if_exists \
            "./artifacts/windows.yml/GeoDa-Windows-x64-installer/GeoDa_${VERSION}_x64_Setup.exe"
      
          upload_if_exists \
            "./artifacts/windows.yml/GeoDa-Windows-arm64-installer/GeoDa_${VERSION}_arm64_Setup.exe"
      
          upload_if_exists \
            "./artifacts/windows.yml/GeoDa-Windows7+-x86-installer/GeoDa_${VERSION}_win7+x86_Setup.exe"
      
          upload_if_exists \
            "./artifacts/windows.yml/GeoDa-Windows7+-x64-installer/GeoDa_${VERSION}_win7+x64_Setup.exe"
      
          # macOS
          upload_if_exists \
            "./artifacts/macos.yml/GeoDa-${VERSION}-x86_64-MacOS/GeoDa${VERSION}-x86_64-Installer.dmg"
      
          upload_if_exists \
            "./artifacts/macos.yml/GeoDa-${VERSION}-arm64-MacOS/GeoDa${VERSION}-arm64-Installer.dmg"
      
          # Ubuntu
          upload_if_exists \
            "./artifacts/ubuntu.yml/GeoDa-${VERSION}-focal/geoda_${VERSION}-1focal1_amd64.deb"
      
          upload_if_exists \
            "./artifacts/ubuntu.yml/GeoDa-${VERSION}-jammy/geoda_${VERSION}-1jammy1_amd64.deb"
      
          upload_if_exists \
            "./artifacts/ubuntu.yml/GeoDa-${VERSION}-noble/geoda_${VERSION}-1noble1_amd64.deb"

      - name: Verify Release Assets
        run: |
          echo "Release created successfully!"
          echo "Release URL: ${{ steps.create_release.outputs.html_url }}"
          echo "Upload URL: ${{ steps.create_release.outputs.upload_url }}"
